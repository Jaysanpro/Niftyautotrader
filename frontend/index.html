<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndianTradingAgents</title>
<meta name="description" content="A desk of agents that research NSE and BSE equities, debate them, size them against a risk rulebook, and tell you what they would do.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='none' stroke='%233ddbd9' stroke-width='2'/></svg>">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand"><span class="pip"></span> ITA</div>
    <span class="chip" id="chip-deep">deep</span>
    <span class="chip" id="chip-quick">quick</span>

    <div class="counters">
      <span>run <b class="state idle" id="c-state">idle</b></span>
      <span><b id="c-agents">0</b> agents</span>
      <span><b id="c-steps">0</b> steps</span>
      <span><b id="c-errors">0</b> faults</span>
      <span><b id="c-elapsed">0.0s</b></span>
    </div>

    <div class="right">
      <span class="chip" id="chip-mode">checking…</span>
      <button class="ghost-btn" id="btn-reset" title="Clear the thread">Clear</button>
    </div>
  </header>

  <!-- Only visible during a screen. A screen is dozens of pipeline runs and
       minutes of waiting, so it gets a bar rather than a spinner. -->
  <div class="progress" id="screen-progress" hidden>
    <div class="progress-bar"><i></i></div><span></span>
  </div>

  <div class="body">

    <!-- ------------------------------------------------------- left rail -->
    <aside class="rail">
      <section class="block">
        <div class="block-head"><span>Desk</span><span class="tag" id="core-state">idle</span></div>
        <canvas id="core" width="420" height="236" aria-hidden="true"></canvas>
      </section>

      <section class="block">
        <div class="block-head"><span>Team</span><span class="tag muted" id="team-count">–</span></div>
        <div id="team"><div class="empty">loading…</div></div>
      </section>

      <section class="block">
        <div class="block-head"><span>Systems</span><span class="tag muted" id="systems-mode">–</span></div>
        <div class="systems" id="systems"></div>
      </section>

      <section class="block">
        <div class="block-head"><span>Session</span><span class="tag muted" id="session-phase">–</span></div>
        <div class="dial-wrap">
          <canvas id="dial" width="128" height="128" aria-hidden="true"
                  style="width:64px;height:64px"></canvas>
          <div class="dial-meta" id="session-meta">–</div>
        </div>
      </section>

      <section class="block">
        <div class="block-head"><span>Operations</span></div>
        <div id="ops"><div class="empty">no run yet</div></div>
      </section>
    </aside>

    <!-- ---------------------------------------------------------- thread -->
    <main class="thread-col">
      <div class="thread" id="thread">
        <div class="msg">
          <div class="who">Desk</div>
          <div class="bubble">Standing by. Name a stock, or ask me to find one.</div>
        </div>
      </div>

      <div class="composer">
        <form id="ask">
          <input id="q" type="text" autocomplete="off" spellcheck="false"
                 placeholder="e.g. RELIANCE.NS — or “screen NIFTY50”" aria-label="Ask the desk">
          <button class="send" id="send" type="submit" aria-label="Run">→</button>
        </form>
        <div class="composer-foot">
          <label>capital
            <input id="capital" type="number" value="1000000" min="1000" step="1000"
                   style="width:92px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--ink-dim)">
          </label>
          <label>as of <input id="asof" type="date" title="Decide a past session"></label>
          <span class="spacer"></span>
          <span><kbd>Enter</kbd> run</span>
        </div>
      </div>
    </main>

    <!-- ----------------------------------------------------------- stage -->
    <section class="stage">
      <nav class="tabs" role="tablist">
        <button class="tab on" data-tab="start" role="tab">Start</button>
        <button class="tab" data-tab="decision" role="tab">Decision</button>
        <button class="tab" data-tab="screen" role="tab">Screen</button>
        <button class="tab" data-tab="desk" role="tab">Desk</button>
      </nav>
      <div class="stage-body" id="stage"></div>
    </section>

  </div>
</div>

<script src="/console.js"></script>
</body>
</html>
